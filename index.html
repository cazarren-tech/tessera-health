<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tessera Health – Coming soon</title>
  <meta name="description" content="Tessera Health – healthcare, pieced together. Something new is on the way.">
  <meta name="theme-color" content="#F2F4F3">

  <!-- Social share previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tessera Health – Coming soon">
  <meta property="og:description" content="Healthcare, pieced together. Something new is on the way.">
  <meta name="twitter:card" content="summary">

  <!-- Favicon: the four-tile logo -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='14' height='14' rx='2' fill='%2312302E'/%3E%3Crect x='17' y='1' width='14' height='14' rx='2' fill='%231F6B5C'/%3E%3Crect x='1' y='17' width='14' height='14' rx='2' fill='%23D9962E'/%3E%3Crect x='17' y='17' width='14' height='14' rx='2' fill='%2312302E'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ground: #F2F4F3;
      --ink: #12302E;
      --ink-soft: #3B4F4B;
      --muted: #4A5D59;
      --line: #D5DDDA;
      --accent: #1F6B5C;
      --ochre: #D9962E;
      --tile-blank: #DDE4E1;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--ground);
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); }
    a:hover { color: var(--ink); }

    .wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* Header */
    header {
      padding-top: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .logo {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 3px;
      width: 30px;
      height: 30px;
    }

    .logo span {
      border-radius: 2px;
      animation: tileDrift 3.2s ease-in-out infinite;
    }
    .logo span:nth-child(1) { background: var(--ink); }
    .logo span:nth-child(2) { background: var(--accent); animation-delay: .8s; }
    .logo span:nth-child(3) { background: var(--ochre); animation-delay: 2.4s; }
    .logo span:nth-child(4) { background: var(--ink); animation-delay: 1.6s; }

    @keyframes tileDrift {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.86); opacity: .8; }
    }

    .wordmark {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      font-size: 22px;
      letter-spacing: -0.01em;
    }

    .badge {
      font-size: 14px;
      color: var(--muted);
      border: 1px solid #C9D3D0;
      border-radius: 999px;
      padding: 6px 14px;
    }

    /* Main */
    main {
      flex: 1;
      padding-top: 40px;
      padding-bottom: 40px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 48px;
    }

    .intro {
      flex: 999 1 420px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Load-in: headline, line, then form, 80ms apart */
    .intro > * { animation: rise 600ms var(--ease-out) both; }
    .intro > *:nth-child(2) { animation-delay: 80ms; }
    .intro > *:nth-child(3) { animation-delay: 160ms; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 500;
      font-size: clamp(2.5rem, 5.5vw, 4.5rem);
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      color: var(--ink-soft);
      max-width: 30rem;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      max-width: 30rem;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    input[type="email"] {
      flex: 1 1 220px;
      min-width: 0;
      height: 50px;
      padding: 0 18px;
      font: inherit;
      font-size: 16px; /* 16px stops iOS zooming on focus */
      color: var(--ink);
      background: #fff;
      border: 1px solid #B9C6C2;
      border-radius: 10px;
    }
    input[type="email"]::placeholder { color: #6B7F7B; }
    input[type="email"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    button {
      flex: 0 0 auto;
      height: 50px;
      padding: 0 24px;
      font: inherit;
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      background: var(--ink);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 200ms ease, transform 160ms var(--ease-out);
    }
    button:active { transform: scale(0.97); }
    @media (hover: hover) and (pointer: fine) {
      button:hover { background: var(--accent); }
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Mosaic */
    .mosaic-wrap {
      flex: 1 1 260px;
      min-width: 0;
      max-width: 340px;
      margin: 0 auto;
    }

    .mosaic {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      touch-action: pan-y;
    }

    /* Each cell holds an ICD-10-AM code, with its tile laid over the top.
       As tiles drift and shrink near the cursor, the codes show through. */
    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
    }

    .code {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--accent);
    }

    .tile {
      position: absolute;
      inset: 0;
      border-radius: 5px;
      will-change: transform;
    }

    /* Footer */
    footer {
      padding-top: 20px;
      padding-bottom: 20px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .logo span { animation: none; }
      .intro > * { animation-name: fade; }   /* keep the fade, drop the movement */
      button { transition: background-color 200ms ease; }
      button:active { transform: none; }
    }
  </style>
</head>
<body>

  <header class="wrap">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <span class="wordmark">Tessera Health</span>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>Healthcare,<br>pieced together.</h1>
      <p class="lede">Something new is on the way. Be the first to know.</p>

      <!--
        Sign-ups currently open the visitor's email app, addressed to
        info@tesserahealth.com.au. To collect them automatically instead,
        add action="<your form service URL>" method="post" to this form
        and remove the "submit" handler in the script at the bottom.
      -->
      <form id="notify">
        <label for="email" class="sr-only">Email address</label>
        <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@organisation.com.au">
        <button type="submit">Notify me</button>
      </form>
    </section>

    <div class="mosaic-wrap">
      <div class="mosaic" id="mosaic" aria-hidden="true"></div>
    </div>
  </main>

  <footer class="wrap">
    <span>© <span id="year">2026</span> Tessera Health</span>
    <a href="mailto:info@tesserahealth.com.au">info@tesserahealth.com.au</a>
  </footer>

  <script>
    (function () {
      document.getElementById('year').textContent = new Date().getFullYear();

      var colours = ['var(--tile-blank)', 'var(--accent)', 'var(--ink)', 'var(--ochre)'];
      var pattern = [
        2,0,1,0,3,0,
        0,1,0,2,0,1,
        3,0,0,1,2,0,
        0,2,1,0,0,3,
        1,0,0,3,1,0,
        0,3,2,0,0,1
      ];

      // One ICD-10-AM code per tile, roughly A to Z through the chapters
      var codes = [
        'A09',   'B34.9', 'C50.9', 'D64.9', 'E11.9', 'F32.9',
        'G40.9', 'H66.9', 'I10',   'I21.9', 'J18.9', 'J45.9',
        'K35.8', 'K80.2', 'L03.1', 'M54.5', 'M17.9', 'N39.0',
        'N18.5', 'O80',   'P07.3', 'Q21.0', 'R07.4', 'R50.9',
        'S06.0', 'S52.5', 'T78.4', 'Z38.0', 'Z51.1', 'U07.1',
        'E66.9', 'F41.9', 'I48.9', 'J44.9', 'K21.9', 'Z00.0'
      ];

      var mosaic = document.getElementById('mosaic');
      var tiles = pattern.map(function (p, i) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        var code = document.createElement('span');
        code.className = 'code';
        code.textContent = codes[i];
        var el = document.createElement('span');
        el.className = 'tile';
        el.style.background = colours[p];
        cell.appendChild(code);
        cell.appendChild(el);
        mosaic.appendChild(cell);
        return { el: el, x: 0, y: 0, r: 0, f: 0, tx: 0, ty: 0, tr: 0, tf: 0, cx: 0, cy: 0 };
      });

      // Sign-up: open an email to Tessera Health with the visitor's address
      document.getElementById('notify').addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value;
        var subject = encodeURIComponent('Notify me when Tessera Health launches');
        var body = encodeURIComponent('Please let me know when you launch.\n\nMy email: ' + email);
        window.location.href = 'mailto:info@tesserahealth.com.au?subject=' + subject + '&body=' + body;
      });

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) return;

      var RADIUS = 180;     // how far from the cursor tiles react (px)
      var PUSH = 14;        // max distance a tile moves (px)
      var TILT = 8;         // max rotation (deg)
      var WAVE = 3;         // idle float height (px) - kept small so it stays calm
      // Physics. Two springs:
      //  - position: tiles carry momentum and wobble a little before settling
      //  - reveal:   heavier and softer, so a revealed code fades back gently
      var POS_K = 170, POS_C = 15;        // damping ratio ~0.58: a couple of soft wobbles
      var REVEAL_K = 16, REVEAL_C = 7.5;  // damping ratio ~0.94: clears in ~0.2s, drifts back over ~1.5s
      // Tap ripple: an outward wave that travels through the mosaic
      var WAVE_SPEED = 520;   // px per second the ripple travels
      var FALLOFF = 140;      // px over which the ripple loses ~63% of its energy
      var KICK = 560;         // outward push (px/s) right at the tap
      var SPIN = 160;         // twist (deg/s) right at the tap
      var REVEAL_KICK = 14;   // how strongly the tapped tile clears to show its code
      var pointer = null, running = false, visible = true, last = 0;
      var start = performance.now();

      // Strong ease-out, close to cubic-bezier(0.23, 1, 0.32, 1)
      function easeOut(p) { return 1 - Math.pow(1 - p, 4); }

      tiles.forEach(function (t, i) {
        var row = Math.floor(i / 6), col = i % 6;
        t.phase = (row + col) * 0.55;   // idle wave ripples diagonally
        t.delay = (row + col) * 0.045;  // 45ms diagonal stagger on load
        t.vx = t.vy = t.vr = t.vf = 0;
        t.kicks = [];   // ripple impulses waiting for the wave front to arrive
        t.extraY = 0;
        t.el.style.opacity = '0';
      });

      function measure() {
        tiles.forEach(function (t) {
          var b = t.el.getBoundingClientRect();
          t.cx = b.left + b.width / 2 - t.x;
          t.cy = b.top + b.height / 2 - t.y - t.extraY;
        });
      }

      function setTargets() {
        tiles.forEach(function (t) {
          if (!pointer) { t.tx = t.ty = t.tr = t.tf = 0; return; }
          var dx = t.cx - pointer.x;
          var dy = t.cy - pointer.y;
          var dist = Math.sqrt(dx * dx + dy * dy) || 1;
          var force = Math.max(0, 1 - dist / RADIUS);
          force = force * force;
          t.tx = (dx / dist) * PUSH * force;
          t.ty = (dy / dist) * PUSH * force;
          t.tr = (dx / dist) * TILT * force;
          t.tf = force;   // how much the tile shrinks to reveal its code
        });
      }

      // Damped spring step: force pulls toward the target, damping bleeds off speed
      function spring(t, key, vkey, target, dt, k, c) {
        t[vkey] += (k * (target - t[key]) - c * t[vkey]) * dt;
        t[key] += t[vkey] * dt;
      }

      // A tap sends a wave outward. Each tile is kicked when the wave front
      // reaches it, harder the closer it is. The springs do the rest.
      function ripple(x, y, strength) {
        measure();
        var now = performance.now();
        tiles.forEach(function (t) {
          var dx = t.cx - x, dy = t.cy - y;
          var d = Math.sqrt(dx * dx + dy * dy);
          var amp = strength * Math.exp(-d / FALLOFF);
          if (amp < 0.03) return;
          var ux = d > 1 ? dx / d : 0, uy = d > 1 ? dy / d : 0;
          t.kicks.push({
            at: now + (d / WAVE_SPEED) * 1000,
            vx: ux * KICK * amp,
            vy: uy * KICK * amp,
            vr: ux * SPIN * amp,
            vf: REVEAL_KICK * amp * amp
          });
        });
      }

      function tick(now) {
        if (!visible) { running = false; return; }   // pause when scrolled out of view
        var dt = Math.min((now - last) / 1000, 1 / 30);  // frame-rate independent
        last = now;
        var time = (now - start) / 1000;

        tiles.forEach(function (t) {
          // apply any ripple impulses whose wave front has arrived
          for (var k = t.kicks.length - 1; k >= 0; k--) {
            var kick = t.kicks[k];
            if (now >= kick.at) {
              t.vx += kick.vx; t.vy += kick.vy; t.vr += kick.vr; t.vf += kick.vf;
              t.kicks.splice(k, 1);
            }
          }

          // springs carry the motion and ease everything back to rest
          spring(t, 'x', 'vx', t.tx, dt, POS_K, POS_C);
          spring(t, 'y', 'vy', t.ty, dt, POS_K, POS_C);
          spring(t, 'r', 'vr', t.tr, dt, POS_K, POS_C);
          spring(t, 'f', 'vf', t.tf, dt, REVEAL_K, REVEAL_C);

          // entrance: fade + rise + scale from 0.92 (never from 0), staggered
          var p = Math.min(1, Math.max(0, (time - t.delay) / 0.6));
          var e = easeOut(p);

          // idle wave fades in once each tile has landed
          var s = Math.sin(time * 1.2 - t.phase) * e;
          t.extraY = s * WAVE + (1 - e) * 10;
          var scale = (0.92 + 0.08 * e) * (1 + s * 0.04) * (1 - 0.45 * Math.max(0, t.f));

          // the tile closest to the finger or cursor fades back to show its code
          t.el.style.opacity = (e * (1 - 0.85 * Math.min(1, Math.max(0, t.f)))).toFixed(3);
          t.el.style.transform =
            'translate(' + t.x.toFixed(2) + 'px,' + (t.y + t.extraY).toFixed(2) + 'px) ' +
            'rotate(' + t.r.toFixed(2) + 'deg) scale(' + scale.toFixed(3) + ')';
        });
        requestAnimationFrame(tick);
      }

      function run() {
        if (running) return;
        running = true;
        last = performance.now();
        requestAnimationFrame(tick);
      }

      measure();
      run();

      if ('IntersectionObserver' in window) {
        new IntersectionObserver(function (entries) {
          visible = entries[0].isIntersecting;
          if (visible) { measure(); run(); }
        }).observe(mosaic);
      }

      function release() { pointer = null; setTargets(); }

      // Mouse: tiles lean away as the cursor moves near them
      window.addEventListener('pointermove', function (e) {
        if (e.pointerType !== 'mouse') return;
        pointer = { x: e.clientX, y: e.clientY };
        setTargets();
      }, { passive: true });

      // Tap or click: send a ripple out from that point
      mosaic.addEventListener('pointerdown', function (e) {
        ripple(e.clientX, e.clientY, 1);
      });

      // Dragging a finger across the mosaic leaves a trail of smaller ripples
      var lastTrail = 0;
      mosaic.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' || e.buttons === 0) return;
        var now = performance.now();
        if (now - lastTrail < 90) return;
        lastTrail = now;
        ripple(e.clientX, e.clientY, 0.5);
      }, { passive: true });

      document.documentElement.addEventListener('mouseleave', release);
      window.addEventListener('blur', release);
      window.addEventListener('resize', measure);
      window.addEventListener('scroll', measure, { passive: true });
    })();
  </script>
</body>
</html>
